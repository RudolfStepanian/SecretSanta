<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Card emblems, viewBox 0 0 60 60: a red-and-white candy cane and a gingerbread man with a bow tie. -->
  <defs>
    <path id="cane-path" d="M24 52V22a8 8 0 0 1 16 0v5" fill="none"/>

    <!-- The gingerbread outline is the same figure drawn wider underneath. -->
    <g id="gb-outline" stroke-linecap="round">
      <path d="M17 28H43" stroke-width="10.6"/>
      <path d="M30 34L22 50M30 34L38 50" stroke-width="11.2"/>
      <ellipse cx="30" cy="33" rx="9.3" ry="11.3"/>
      <circle cx="30" cy="15" r="9.6"/>
    </g>
    <g id="gb-shape" stroke-linecap="round">
      <path d="M17 28H43" stroke-width="8.2"/>
      <path d="M30 34L22 50M30 34L38 50" stroke-width="8.8"/>
      <ellipse cx="30" cy="33" rx="8.1" ry="10.1"/>
      <circle cx="30" cy="15" r="8.4"/>
    </g>
  </defs>

  <symbol id="cane" viewBox="0 0 60 60">
    <g transform="matrix(-1 0 0 1 60 0)">
      <use href="#cane-path" stroke="#4a0a16" stroke-opacity=".4" stroke-width="10.5" stroke-linecap="round"/>
      <use href="#cane-path" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <use href="#cane-path" stroke="#d42a3c" stroke-width="8" stroke-dasharray="6 3"/>
    </g>
  </symbol>

  <symbol id="gingerbread" viewBox="0 0 60 60">
    <use href="#gb-outline" fill="#6e3a14" stroke="#6e3a14"/>
    <use href="#gb-shape" fill="#c47a3d" stroke="#c47a3d"/>
    <g fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round">
      <path d="M19.2 25.6q-1.2 2.4 0 4.8M40.8 25.6q1.2 2.4 0 4.8"/>
      <path d="M20.2 46.2q2.4 2.6 5.3 1.2M39.8 46.2q-2.4 2.6-5.3 1.2"/>
      <path d="M26.6 17.6q3.4 2.8 6.8 0"/>
    </g>
    <g fill="#3a1d0a">
      <circle cx="27.2" cy="13.4" r="1.35"/>
      <circle cx="32.8" cy="13.4" r="1.35"/>
    </g>
    <path d="M30 23.6l-5.4-3.2v6.4zM30 23.6l5.4-3.2v6.4z" fill="#d42a3c" stroke="#7a1023" stroke-width=".6"/>
    <circle cx="30" cy="23.6" r="1.5" fill="#a3182f"/>
    <circle cx="30" cy="31" r="1.8" fill="#e6b84a"/>
    <circle cx="30" cy="36.4" r="1.8" fill="#e6b84a"/>
  </symbol>
</svg>
