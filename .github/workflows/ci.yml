name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Check the EF model matches the migrations
        run: dotnet ef migrations has-pending-model-changes --project src/SecretSanta --no-build --configuration Release

      - name: Docker build
        run: docker build -t secretsanta:ci .

      - name: Check the image has the Asia/Yerevan time zone
        run: docker run --rm --entrypoint test secretsanta:ci -f /usr/share/zoneinfo/Asia/Yerevan
