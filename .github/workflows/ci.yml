name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: santa
          POSTGRES_PASSWORD: santa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U santa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
      # Tests that need PostgreSQL create a throwaway database on this server.
      SECRETSANTA_TEST_DB: Host=localhost;Port=5432;Username=santa;Password=santa;Database=postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Check the EF model matches the migrations
        run: dotnet ef migrations has-pending-model-changes --project src/SecretSanta --no-build --configuration Release

      - name: Docker build
        run: docker build -t secretsanta:ci .

      - name: Check the image has the Asia/Yerevan time zone
        run: docker run --rm --entrypoint test secretsanta:ci -f /usr/share/zoneinfo/Asia/Yerevan
