services:
  - type: web
    name: secretsanta
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    # Deploy a commit to main only after the GitHub Actions CI checks on it have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
